# Model L -- Nepali. Target ~25M trainable parameters.
#
# Width and head count match Telugu's; only depth differs. Nepali's 32k
# vocabulary costs 12.3M parameters in the embedding against Telugu's 6.1M, so
# the body is three layers shallower to land at the same ~25M budget. The
# embedding therefore takes a much larger share of this model than of Telugu's,
# which is worth keeping in mind when comparing the two.
model:
  d_model: 384
  n_layers: 7
  n_heads: 6            # d_head = 64
  d_ff: 1536            # 4x d_model
  max_seq_len: 512
  dropout: 0.1
  attn_dropout: 0.1
  tie_embeddings: true  # saves vocab_size x d_model = 12.3M parameters
  norm_first: true      # pre-norm; see common/model/block.py

train:
  batch_size: 16
  grad_accum_steps: 8   # effective batch 128 sequences = 65,536 tokens/step
  max_steps: 20000
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_every: 500
  eval_batches: 50
  checkpoint_every: 1000
  log_every: 20
  seed: 1337
  precision: auto
