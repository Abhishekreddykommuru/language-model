model:
  vocab_size: 8000
  d_model: 384
  n_layers: 12
  n_heads: 6
  d_ff: 1536
  max_seq_len: 512
  dropout: 0.1
  attn_dropout: 0.1
  tie_embeddings: true
  norm_first: true
train:
  batch_size: 16
  grad_accum_steps: 8
  max_steps: 20700
  learning_rate: 0.0003
  min_learning_rate: 3.0e-05
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_every: 500
  eval_batches: 50
  checkpoint_every: 1000
  log_every: 20
  seed: 1337
  precision: fp16
  compile_model: false
