# Model H -- Telugu. 24,562,944 trainable parameters.
#
# Width and head count are deliberately identical to Nepali's; only depth
# differs. Telugu's 8k vocabulary costs 3.1M parameters in the embedding against
# Nepali's 12.3M, and that difference is spent on five extra layers here.
# Keeping d_model and n_heads fixed means the H-vs-L comparison has one
# architectural variable rather than three.
model:
  d_model: 384
  n_layers: 12
  n_heads: 6            # d_head = 64
  d_ff: 1536            # 4x d_model
  max_seq_len: 512
  dropout: 0.1
  attn_dropout: 0.1
  tie_embeddings: true  # saves vocab_size x d_model = 3.1M parameters
  norm_first: true      # pre-norm; see common/model/block.py

train:
  batch_size: 16
  grad_accum_steps: 8   # effective batch 128 sequences = 65,536 tokens/step
  max_steps: 20700
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_every: 500
  eval_batches: 50
  checkpoint_every: 1000
  log_every: 20
  seed: 1337
  precision: auto
